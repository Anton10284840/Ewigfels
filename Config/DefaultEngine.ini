; =====================================================================
; Ewigfels – DefaultEngine.ini
; Rendering-Basis für den Cinematic-Look (Grafik-Bibel 3.2).
; Feintuning (LUTs, Skalierbarkeits-Presets) folgt in Phase 1/4.
; =====================================================================

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Ewigfels.EwigfelsGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Globale Beleuchtung & Reflexionen: Lumen (1 = Lumen) ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
; --- Hardware-Raytracing (RTX 5070 kann es) ---
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.SkinCache.CompileShaders=True
; --- Schatten: Virtual Shadow Maps ---
r.Shadow.Virtual.Enable=1
; --- Nanite & Virtual Textures ---
r.Nanite.ProjectEnabled=True
r.VirtualTextures=True
; --- Kein statisches Licht-Baking (alles dynamisch) ---
r.AllowStaticLighting=False
; --- Anti-Aliasing/Upscaling: 4 = TSR ---
r.AntiAliasingMethod=4
; --- Auto-Exposure mit erweitertem Bereich (Innen/Außen) ---
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; --- Custom Depth mit Stencil (Outlines, Magie-Masken) ---
r.CustomDepth=3
; --- Motion Blur dezent, im Menü abschaltbar ---
r.DefaultFeature.MotionBlur=True

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/Ewigfels")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/Ewigfels")

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Python-Entwicklermodus (Autovervollständigung-Stubs in Intermediate/PythonStub)
bDeveloperMode=True
